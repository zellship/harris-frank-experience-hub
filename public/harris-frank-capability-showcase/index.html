<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Harris & Frank Capability Showcase: una lectura independiente de la arquitectura y experiencias de Zellship Business OS."
    />
    <meta name="author" content="Zellship" />
    <meta name="theme-color" content="#111c34" />
    <link rel="icon" href="data:," />
    <title>Harris &amp; Frank Capability Showcase</title>
    <script type="module" crossorigin src="./assets/index-DLz7N4wM.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-ZSxzqibb.css">
    <style>
      @media (min-width: 961px) {
        .hfld-secondary nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      /*
       * Live demo shell: the shared controller floats over the experience
       * instead of reserving a full gray row below it. Pointer or keyboard
       * activity reveals the dock; inactivity returns the whole viewport to
       * the demonstrated surface.
       */
      .hfex-frame {
        position: relative;
        display: block;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }

      .hfex-frame > :first-child {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        overflow: auto;
      }

      .hfex-controller {
        position: fixed;
        right: auto;
        bottom: max(14px, env(safe-area-inset-bottom));
        left: 50%;
        width: auto;
        max-width: calc(100vw - 28px);
        margin: 0;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 12px);
        transition:
          opacity 180ms ease,
          transform 180ms ease;
      }

      body.hfex-controls-active .hfex-controller,
      .hfex-controller:focus-within {
        opacity: 1;
        pointer-events: auto;
        transform: translate(-50%, 0);
      }

      .hfex-controller-reveal-zone {
        position: fixed;
        z-index: 949;
        right: 0;
        bottom: 0;
        left: 0;
        height: 20px;
        background: transparent;
      }

      @media (prefers-reduced-motion: reduce) {
        .hfex-controller {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="showcase-root"></div>
    <script>
      (() => {
        const retailDemoUrl =
          "https://zellship.github.io/zellship-maintenance-os-demo/retail/";
        let controlsTimer;

        const revealDemoControls = () => {
          document.body.classList.add("hfex-controls-active");
          window.clearTimeout(controlsTimer);
          controlsTimer = window.setTimeout(() => {
            if (!document.querySelector(".hfex-controller:focus-within")) {
              document.body.classList.remove("hfex-controls-active");
            }
          }, 2600);
        };

        const ensureControllerRevealZone = () => {
          const controller = document.querySelector(".hfex-controller");
          let revealZone = document.querySelector(
            ".hfex-controller-reveal-zone",
          );

          if (!controller) {
            revealZone?.remove();
            document.body.classList.remove("hfex-controls-active");
            return;
          }

          if (!revealZone) {
            revealZone = document.createElement("div");
            revealZone.className = "hfex-controller-reveal-zone";
            revealZone.setAttribute("aria-hidden", "true");
            revealZone.addEventListener("pointerenter", revealDemoControls);
            document.body.append(revealZone);
          }

          revealDemoControls();
        };

        const addRetailDemoAccess = () => {
          const secondaryNavigation = document.querySelector(
            ".hfld-secondary nav",
          );
          if (
            !secondaryNavigation ||
            secondaryNavigation.querySelector("[data-retail-demo-link]")
          ) {
            return;
          }

          const link = document.createElement("a");
          link.href = retailDemoUrl;
          link.target = "_blank";
          link.rel = "noreferrer";
          link.dataset.retailDemoLink = "true";
          link.setAttribute(
            "aria-label",
            "Abrir demo operativa Retail en una pestaña nueva",
          );

          const icon = document.createElement("span");
          icon.setAttribute("aria-hidden", "true");
          icon.textContent = "↗";

          link.append(icon, " Demo operativa Retail");
          secondaryNavigation.insertBefore(
            link,
            secondaryNavigation.children[1] || null,
          );
        };

        document.addEventListener("pointermove", revealDemoControls, {
          passive: true,
        });
        document.addEventListener("pointerdown", revealDemoControls, {
          passive: true,
        });
        document.addEventListener("keydown", revealDemoControls);
        document.addEventListener("focusin", revealDemoControls);

        const observer = new MutationObserver(() => {
          addRetailDemoAccess();
          ensureControllerRevealZone();
        });
        observer.observe(document.body, { childList: true, subtree: true });
        addRetailDemoAccess();
        ensureControllerRevealZone();
      })();
    </script>
  </body>
</html>
